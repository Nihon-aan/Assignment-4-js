<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- daisy UI -->


    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <style>
        * {
            font-family: "Geist", sans-serif;

        }
    </style>


    <title>Job Tracker</title>


</head>



<body class="bg-[#F8FAFC] min-h-screen">

    <main class="max-w-[1120px] mx-auto py-[60px]">





        <section class="count border-b-2 border-b-[#E6E7E9]">
            <h1 class="font-bold text-[32px] leading-8 mb-[20px]">Job Application Tracker</h1>

            <div class="count-container flex gap-[16px] flex-wrap justify-center mb-[30px]">

                <div class="count-total p-5 bg-white w-[360px] rounded-lg">
                    <p class="title text-[14px] font-medium">Total</p>
                    <h1 class="count text-[24px] font-bold">8</h1>
                </div>

                <div class="count-interview p-5 bg-white w-[360px] rounded-lg">
                    <p class="title text-[14px] font-medium">Interview</p>
                    <h1 class="count text-[24px] text-[#10B981] font-bold">0</h1>
                </div>

                <div class="count-rejected p-5 bg-white w-[360px] rounded-lg">
                    <p class="title text-[14px] font-medium">Rejected</p>
                    <h1 class="count text-[24px] text-[#EF4444] font-bold">0</h1>
                </div>



                

            </div>
        </section>



        <section class="info-section mt-[30px]">

            <section class="info-title flex justify-between mb-[24px]">

                <div class="title-text"><h1 class="text-[20px] font-semibold">Available jobs</h1></div>
                <div class="title-count"><p class="text-[16px] font-medium"><Span>8</Span>Jobs</p></div>

            </section>



            <div class="button-container">


                
                <button class="btn bg-white border-none px-[12px] py-[8px] min-w-[80px]">All</button>
                <button class="btn bg-white border-none px-[12px] py-[8px] min-w-[80px]">Interview</button>
                <button class="btn bg-white border-none px-[12px] py-[8px] min-w-[80px]">Rejected</button>
            
            
            
            </div>












        </section>















    </main>











</body>

</html>
